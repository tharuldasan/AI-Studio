<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { margin-top: 0; text-align: center; }
    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      resize: vertical;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 14px; text-align: center; color: #94a3b8; }
    .image-preview {
      margin-top: 20px;
      text-align: center;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    .image-preview img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Image Studio</h1>
  
  <label for="promptInput">Enter Prompt:</label>
  <textarea id="promptInput" placeholder="A futuristic cyberpunk city in neon rain, 8k resolution..."></textarea>
  
  <button id="generateBtn" onclick="generateImage()">Generate Image (Free)</button>
  <div id="statusText" class="status"></div>

  <div class="image-preview" id="imageContainer">
    <span style="color:#64748b;">Generated image will appear here</span>
  </div>
</div>

<script>
async function generateImage() {
  const prompt = document.getElementById('promptInput').value.trim();
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('statusText');
  const container = document.getElementById('imageContainer');

  if (!prompt) {
    alert("Please enter a prompt!");
    return;
  }

  // UI Loading State
  btn.disabled = true;
  status.innerText = "Generating image via Pollinations AI...";
  container.innerHTML = `<span style="color:#38bdf8;">Creating image, please wait...</span>`;

  try {
    // Generate direct URL using Pollinations public API (No backend / CORS needed)
    const encodedPrompt = encodeURIComponent(prompt);
    const randomSeed = Math.floor(Math.random() * 10000000);
    const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=1024&height=1024&seed=${randomSeed}&model=flux`;

    // Preload image in memory to ensure it loads before rendering
    const img = new Image();
    img.src = imageUrl;
    
    img.onload = () => {
      container.innerHTML = `<img src="${imageUrl}" alt="Generated Image" />`;
      status.innerText = "Done!";
      btn.disabled = false;
    };

    img.onerror = () => {
      container.innerHTML = `<span style="color:#f87171;">Failed to load image. Please try again.</span>`;
      status.innerText = "Error occurred.";
      btn.disabled = false;
    };

  } catch (err) {
    console.error(err);
    status.innerText = "Error: " + err.message;
    btn.disabled = false;
  }
}
</script>

</body>
</html>
