<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Image Studio</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --border: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    label { 
      font-size: 12px; 
      color: #94a3b8; 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 600;
    }
    input[type="password"], textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090d16;
      color: white;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 14px;
    }
    textarea { height: 80px; resize: vertical; }

    .btn-main {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-main:hover { background: var(--accent-hover); }
    .btn-main:disabled { background: #334155; cursor: not-allowed; }

    .status { 
      margin-top: 12px; 
      font-size: 13px; 
      text-align: center; 
      color: #38bdf8; 
      min-height: 20px; 
    }
    
    .preview-box {
      margin-top: 16px;
      text-align: center;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border: 1px dashed var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 12px;
    }
    .preview-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h3 style="margin:0;">Gemini AI Image Studio</h3>
    <small style="color:#94a3b8;">Direct Gemini API Client-Side Generation</small>
  </div>

  <label>Gemini API Key (Saved Locally):</label>
  <input type="password" id="apiKeyInput" placeholder="Paste your AI Studio API key here...">

  <label>Select Gemini Model:</label>
  <select id="modelSelect">
    <option value="gemini-2.5-flash-image">gemini-2.5-flash-image</option>
    <option value="gemini-3.1-flash-image">gemini-3.1-flash-image</option>
  </select>

  <label>Aspect Ratio / Resolution:</label>
  <select id="aspectSelect">
    <option value="16:9 Landscape (1920x1080)">16:9 Landscape (1920x1080)</option>
    <option value="9:16 Vertical (1080x1920)">9:16 Vertical (1080x1920)</option>
    <option value="1:1 Square (1024x1024)">1:1 Square (1024x1024)</option>
  </select>

  <label>Image Description (Prompt):</label>
  <textarea id="promptInput" placeholder="A futuristic cyberpunk street at night, 8k resolution, cinematic lighting..."></textarea>

  <button class="btn-main" id="generateBtn" onclick="generateGeminiImage()">Generate Image</button>

  <div id="statusText" class="status"></div>

  <div class="preview-box" id="imageContainer">
    <span style="color:#64748b;">Generated image will appear here</span>
  </div>
</div>

<script>
// Load stored API Key if available
document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';

async function generateGeminiImage() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const modelName = document.getElementById('modelSelect').value;
  const aspectRatio = document.getElementById('aspectSelect').value;
  const rawPrompt = document.getElementById('promptInput').value.trim();
  
  const status = document.getElementById('statusText');
  const container = document.getElementById('imageContainer');
  const generateBtn = document.getElementById('generateBtn');

  if (!apiKey) {
    alert("Please enter a valid Gemini API key!");
    return;
  }
  if (!rawPrompt) {
    alert("Please enter an image prompt!");
    return;
  }

  // Save key locally in browser storage
  localStorage.setItem('gemini_api_key', apiKey);

  generateBtn.disabled = true;
  status.innerText = "Connecting to Gemini API and generating image...";
  container.innerHTML = `<span style="color:#38bdf8;">Rendering base64 image data... Please wait.</span>`;

  // Combine user prompt with technical specs
  const finalPrompt = `${rawPrompt}. [Target aspect ratio and render requirements: ${aspectRatio}, ultra high detail, photorealistic]`;

  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

  const payload = {
    contents: [
      {
        parts: [
          { text: finalPrompt }
        ]
      }
    ],
    generationConfig: {
      responseModalities: ["TEXT", "IMAGE"]
    }
  };

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const errData = await response.json();
      throw new Error(errData.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const candidateParts = data.candidates?.[0]?.content?.parts || [];
    const imagePart = candidateParts.find(part => part.inlineData);

    if (imagePart) {
      const mimeType = imagePart.inlineData.mimeType || "image/png";
      const base64Data = imagePart.inlineData.data;
      const imageUrl = `data:${mimeType};base64,${base64Data}`;

      container.innerHTML = `<img src="${imageUrl}" alt="Gemini Generated Image" />`;
      status.innerText = "Generation Successful!";
    } else {
      status.innerText = "No image bytes returned. Check prompt or safety filters.";
    }

  } catch (err) {
    console.error("Gemini Generation Error:", err);
    status.innerText = "Error: " + err.message;
  } finally {
    generateBtn.disabled = false;
  }
}
</script>

</body>
</html>
