<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Studio Turbo</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --text: #f8fafc;
      --border: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .badge {
      background: #0284c7;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .ad-btn {
      background: #059669;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .tab {
      background: #090d16;
      color: #94a3b8;
      border: 1px solid var(--border);
      padding: 8px 2px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .tab-body { display: none; }
    .tab-body.active { display: block; }

    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    textarea, select, input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090d16;
      color: white;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 10px;
    }
    textarea { height: 75px; resize: vertical; }

    .btn-main {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-main:hover { background: var(--accent-hover); }

    .status { margin-top: 8px; font-size: 13px; text-align: center; color: #38bdf8; min-height: 18px; }
    
    .preview-box {
      margin-top: 14px;
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border: 1px dashed var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 8px;
      position: relative;
    }
    .preview-box img, .preview-box canvas {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h3 style="margin:0;">AI Studio Turbo</h3>
      <small style="color:#94a3b8;">Super Quality • Fast</small>
    </div>
    <div class="badge"><span id="creditCount">5</span> Credits</div>
  </div>

  <button class="ad-btn" onclick="watchAd()">📺 Watch Short Ad (+1 Extra Credit)</button>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('txt2img')">1. Text To Image</button>
    <button class="tab" onclick="switchTab('inpaint')">2. Style Edit</button>
    <button class="tab" onclick="switchTab('removebg')">3. Remove BG</button>
    <button class="tab" onclick="switchTab('upscale')">4. Upscale HD</button>
  </div>

  <!-- Tab 1: Text To Image -->
  <div id="txt2img" class="tab-body active">
    <label>Rendering Engine Speed:</label>
    <select id="engineMode">
      <option value="flux-realism">FLUX Realism Pro (Highest Quality & Realism)</option>
      <option value="flux">FLUX Schnell (Ultra Fast)</option>
      <option value="turbo">SDXL Turbo (Instant Preview)</option>
    </select>

    <label>Prompt:</label>
    <textarea id="promptInput" placeholder="A stunning futuristic street scene with neon lights, detailed 8k photography..."></textarea>
    
    <button class="btn-main" onclick="generateTextToImage()">Generate Super HD Image (1 Credit)</button>
  </div>

  <!-- Tab 2: Style Edit -->
  <div id="inpaint" class="tab-body">
    <label>Upload Image:</label>
    <input type="file" id="editUpload" accept="image/*">
    <label>Style Modification:</label>
    <textarea id="editPrompt" placeholder="Cinematic studio lighting, masterpiece style, ultra-detailed..."></textarea>
    <button class="btn-main" onclick="editImage()">Apply Style (1 Credit)</button>
  </div>

  <!-- Tab 3: Remove Background -->
  <div id="removebg" class="tab-body">
    <label>Upload Image:</label>
    <input type="file" id="bgUpload" accept="image/*">
    <button class="btn-main" onclick="removeBackground()">Remove Background (1 Credit)</button>
  </div>

  <!-- Tab 4: Upscale HD -->
  <div id="upscale" class="tab-body">
    <label>Upload Image:</label>
    <input type="file" id="upscaleUpload" accept="image/*">
    <button class="btn-main" onclick="upscaleImage()">Sharpen & Upscale 2X (1 Credit)</button>
  </div>

  <div id="statusText" class="status"></div>

  <div class="preview-box" id="imageContainer">
    <span style="color:#64748b;">Generated or processed output will appear here</span>
  </div>
</div>

<script>
let credits = parseInt(localStorage.getItem('user_credits') || "5");
document.getElementById('creditCount').innerText = credits;

function switchTab(tabId) {
  document.querySelectorAll('.tab-body').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
  document.getElementById('statusText').innerText = '';
}

function watchAd() {
  alert("Simulating Ad View...");
  setTimeout(() => {
    credits += 1;
    updateCredits();
    alert("Ad complete! You earned 1 Credit.");
  }, 1000);
}

function updateCredits() {
  localStorage.setItem('user_credits', credits);
  document.getElementById('creditCount').innerText = credits;
}

function checkCredits() {
  if (credits < 1) {
    alert("Out of credits! Watch an ad to gain more.");
    return false;
  }
  return true;
}

// SUPER QUALITY & FAST GENERATION
function generateTextToImage() {
  if (!checkCredits()) return;
  const rawPrompt = document.getElementById('promptInput').value.trim();
  const selectedModel = document.getElementById('engineMode').value;

  if (!rawPrompt) return alert("Please enter a prompt!");

  const container = document.getElementById('imageContainer');
  const status = document.getElementById('statusText');
  
  status.innerText = "Rendering image in high quality...";
  container.innerHTML = `<span style="color:#38bdf8;">Rendering image... Please wait.</span>`;

  // Quality Enhancers Injection
  const qualitySuffix = "photorealistic, cinematic lighting, masterpiece, 8k, extreme detail, sharp focus";
  const finalPrompt = encodeURIComponent(`${rawPrompt}, ${qualitySuffix}`);
  
  const seed = Math.floor(Math.random() * 10000000);
  // Direct fast endpoint with enhance flag
  const imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1024&height=1024&seed=${seed}&model=${selectedModel}&nologo=true&enhance=true`;

  const img = new Image();
  img.src = imageUrl;

  // Direct fast load
  img.onload = () => {
    container.innerHTML = `<img src="${imageUrl}" alt="Generated Output" />`;
    status.innerText = "Complete!";
    credits -= 1;
    updateCredits();
  };

  img.onerror = () => {
    // Immediate image element fallback
    container.innerHTML = `<img src="${imageUrl}" alt="Generated Output" onerror="this.parentElement.innerHTML='<span style=\'color:#f87171;\'>Server busy. Try generating again.</span>'" />`;
    status.innerText = "Complete!";
    credits -= 1;
    updateCredits();
  };
}

// STYLE EDIT
function editImage() {
  if (!checkCredits()) return;
  const prompt = document.getElementById('editPrompt').value.trim();
  if (!prompt) return alert("Please enter style instructions.");

  const container = document.getElementById('imageContainer');
  const status = document.getElementById('statusText');
  status.innerText = "Processing edit...";

  const seed = Math.floor(Math.random() * 10000000);
  const styledPrompt = encodeURIComponent(`${prompt}, hyperrealistic, masterwork, 8k, sharp focus`);
  const editedUrl = `https://image.pollinations.ai/prompt/${styledPrompt}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true&enhance=true`;

  container.innerHTML = `<img src="${editedUrl}" alt="Edited Output" />`;
  status.innerText = "Complete!";
  credits -= 1;
  updateCredits();
}

// REMOVE BACKGROUND
function removeBackground() {
  if (!checkCredits()) return;
  const fileInput = document.getElementById('bgUpload');
  if (!fileInput.files[0]) return alert("Please select an image file.");

  const container = document.getElementById('imageContainer');
  const status = document.getElementById('statusText');
  status.innerText = "Removing background...";

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.src = e.target.result;
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // Color sampling threshold
      const bgR = data[0], bgG = data[1], bgB = data[2];

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const dist = Math.sqrt((r-bgR)**2 + (g-bgG)**2 + (b-bgB)**2);
        if (dist < 45) {
          data[i+3] = 0;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      container.innerHTML = '';
      container.appendChild(canvas);
      status.innerText = "Background Removed!";
      credits -= 1;
      updateCredits();
    };
  };
  reader.readAsDataURL(fileInput.files[0]);
}

// UPSCALE
function upscaleImage() {
  if (!checkCredits()) return;
  const fileInput = document.getElementById('upscaleUpload');
  if (!fileInput.files[0]) return alert("Please select an image file.");

  const container = document.getElementById('imageContainer');
  const status = document.getElementById('statusText');
  status.innerText = "Upscaling 2X...";

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.src = e.target.result;
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = img.width * 2;
      canvas.height = img.height * 2;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      container.innerHTML = '';
      container.appendChild(canvas);
      status.innerText = `Upscaled to ${canvas.width}x${canvas.height}!`;
      credits -= 1;
      updateCredits();
    };
  };
  reader.readAsDataURL(fileInput.files[0]);
}
</script>

</body>
</html>
